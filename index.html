<body>
<div id="app">

  <header id="app-header">

    <div class="header-left">
      <a href="../index.html">
        <img src="/geoglows-logo-nav.png" alt="HydroSOS Logo" class="header-logo">
      </a>
      <h1>HydroSOS Dashboard</h1>
    </div>

    <div class="header-right">
      <input id="basin-search" type="text" placeholder="Search HYBAS_ID...">
      <button id="search-button">Search</button>
      <button id="toggle-panel" aria-expanded="false" aria-controls="basin-panel">Show Charts</button>
    </div>

  </header>

  <div id="workspace">

    <div id="map"></div>

    <aside id="basin-panel" class="panel hidden">
    <div class="panel-content">
      <button id="close-modal">&times;</button>
      <div id="loading" class="loading-overlay" style="display:none;">
        <div class="spinner"></div>
      </div>
      <div id="basin-info"></div>
      <section class="chart-section">
        <h2 class="chart-title">Monthly HydroSOS Status</h2>
        <p class="chart-subtitle">Monthly flow conditions relative to the past 30 years.</p>
        <div id="hydrosos-bands" class="plot"></div>
      </section>

      <section class="chart-section">
        <h2 class="chart-title">Seasonal Outlook</h2>
        <p class="chart-subtitle">Historical analogs show the likely range of cumulative runoff over the next three months.</p>
        <div id="forecast-envelope" class="plot"></div>
      </section>

      <section class="chart-section">
        <h2 class="chart-title">Cumulative Volume</h2>
        <p class="chart-subtitle">Compare this year's cumulative runoff to the past 30 years.</p>
        <div id="cumulative-volume" class="plot"></div>
      </section>
    </div>

    </aside>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
